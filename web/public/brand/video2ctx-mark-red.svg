<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">video2ctx red mark</title>
  <desc id="desc">A white video play symbol and two transcript lines enclosed by context brackets on a vermilion squircle.</desc>

  <!-- A deliberately soft squircle: friendly at app-icon size, precise at large scale. -->
  <path
    fill="#e94b3d"
    d="M176 32h160c92.4 0 144 51.6 144 144v160c0 92.4-51.6 144-144 144H176C83.6 480 32 428.4 32 336V176C32 83.6 83.6 32 176 32Z"
  />

  <!-- Context brackets. Their open centre keeps the mark from feeling like a generic screen. -->
  <path
    fill="none"
    stroke="#fff"
    stroke-width="25"
    stroke-linecap="round"
    d="M160 137h-21c-22.1 0-40 17.9-40 40v158c0 22.1 17.9 40 40 40h21"
  />
  <path
    fill="none"
    stroke="#fff"
    stroke-width="25"
    stroke-linecap="round"
    d="M352 137h21c22.1 0 40 17.9 40 40v158c0 22.1-17.9 40-40 40h-21"
  />

  <!-- The play signal sits slightly above centre to make room for the context output below. -->
  <path
    fill="#fff"
    d="M197 181.7c0-10.5 11.5-17 20.5-11.6l92.9 55.8c8.8 5.3 8.8 18 0 23.3L217.5 305c-9 5.4-20.5-1.1-20.5-11.6V181.7Z"
  />

  <!-- Two unequal bars suggest transcript, evidence, and the product's '2'. -->
  <path
    fill="none"
    stroke="#fff"
    stroke-width="18"
    stroke-linecap="round"
    d="M208 337h96M224 369h64"
  />
</svg>
