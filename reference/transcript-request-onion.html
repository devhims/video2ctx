  background: var(--primary-foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;transcript-path-viz&quot;&gt;
  &lt;header class=&quot;viz-heading&quot;&gt;
    &lt;h2&gt;Transcript request — ordered path&lt;/h2&gt;
    &lt;p&gt;Request moves inward. Response moves outward. Select any ring to inspect that layer.&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;onion-stage&quot;&gt;
    &lt;svg viewBox=&quot;0 0 620 620&quot; role=&quot;img&quot; aria-labelledby=&quot;onion-title onion-desc&quot;&gt;
      &lt;title id=&quot;onion-title&quot;&gt;Transcript request processing layers&lt;/title&gt;
      &lt;desc id=&quot;onion-desc&quot;&gt;Ten concentric, clickable layers. The request travels from the Worker through middleware, authentication, authorization, handler, metering, cache, and YouTube. The response travels back outward.&lt;/desc&gt;
      &lt;defs&gt;
        &lt;marker id=&quot;request-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;8&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto-start-reverse&quot;&gt;
          &lt;path d=&quot;M 0 0 L 10 5 L 0 10 z&quot; fill=&quot;var(--foreground)&quot;&gt;&lt;/path&gt;
        &lt;/marker&gt;
      &lt;/defs&gt;

      &lt;g class=&quot;rings&quot; transform=&quot;translate(310 310)&quot;&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;entry&quot; r=&quot;264&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 1, Worker entry&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;router&quot; r=&quot;238&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 2, Hono router&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;context&quot; r=&quot;212&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 3, request context middleware&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;cors&quot; r=&quot;186&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 4, CORS middleware&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;auth&quot; r=&quot;160&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 5, authentication middleware&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;authorization&quot; r=&quot;134&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 6, authorization middleware&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;handler&quot; r=&quot;108&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 7, transcript handler&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;metering&quot; r=&quot;82&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 8, credit metering&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring&quot; data-layer=&quot;cache&quot; r=&quot;56&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 9, transcript cache&quot;&gt;&lt;/circle&gt;
        &lt;circle class=&quot;ring core-ring&quot; data-layer=&quot;upstream&quot; r=&quot;30&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Layer 10, transcript library and YouTube&quot;&gt;&lt;/circle&gt;
      &lt;/g&gt;

      &lt;g class=&quot;flow-arrow&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;line x1=&quot;18&quot; y1=&quot;310&quot; x2=&quot;300&quot; y2=&quot;310&quot; marker-end=&quot;url(#request-arrow)&quot;&gt;&lt;/line&gt;
        &lt;line x1=&quot;320&quot; y1=&quot;310&quot; x2=&quot;602&quot; y2=&quot;310&quot; marker-end=&quot;url(#request-arrow)&quot;&gt;&lt;/line&gt;
        &lt;text x=&quot;22&quot; y=&quot;292&quot;&gt;REQUEST — INWARD&lt;/text&gt;
        &lt;text x=&quot;598&quot; y=&quot;292&quot; text-anchor=&quot;end&quot;&gt;RESPONSE — OUTWARD&lt;/text&gt;
      &lt;/g&gt;

      &lt;g class=&quot;step-numbers&quot; aria-hidden=&quot;true&quot;&gt;
        &lt;text x=&quot;46&quot; y=&quot;315&quot;&gt;1&lt;/text&gt;
        &lt;text x=&quot;72&quot; y=&quot;315&quot;&gt;2&lt;/text&gt;
        &lt;text x=&quot;98&quot; y=&quot;315&quot;&gt;3&lt;/text&gt;
        &lt;text x=&quot;124&quot; y=&quot;315&quot;&gt;4&lt;/text&gt;
        &lt;text x=&quot;150&quot; y=&quot;315&quot;&gt;5&lt;/text&gt;
        &lt;text x=&quot;176&quot; y=&quot;315&quot;&gt;6&lt;/text&gt;
        &lt;text x=&quot;202&quot; y=&quot;315&quot;&gt;7&lt;/text&gt;
        &lt;text x=&quot;228&quot; y=&quot;315&quot;&gt;8&lt;/text&gt;
        &lt;text x=&quot;254&quot; y=&quot;315&quot;&gt;9&lt;/text&gt;
        &lt;text x=&quot;280&quot; y=&quot;315&quot;&gt;10&lt;/text&gt;
      &lt;/g&gt;

      &lt;text class=&quot;center-label&quot; x=&quot;310&quot; y=&quot;306&quot; text-anchor=&quot;middle&quot;&gt;YouTube&lt;/text&gt;
      &lt;text class=&quot;center-subtitle&quot; x=&quot;310&quot; y=&quot;322&quot; text-anchor=&quot;middle&quot;&gt;transcript&lt;/text&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;section class=&quot;layer-detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;layer-count&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;layer-copy&quot;&gt;
      &lt;h3&gt;&lt;/h3&gt;
      &lt;p class=&quot;operation&quot;&gt;&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;service-detail&quot;&gt;
      &lt;span&gt;Runs on / uses&lt;/span&gt;
      &lt;strong&gt;&lt;/strong&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;outcomes&quot; aria-labelledby=&quot;outcomes-title&quot;&gt;
    &lt;div class=&quot;section-heading&quot;&gt;
      &lt;h3 id=&quot;outcomes-title&quot;&gt;Possible exits and outcomes&lt;/h3&gt;
      &lt;span&gt;evaluated in this order&lt;/span&gt;
    &lt;/div&gt;
    &lt;ol&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;cors&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;1&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;CORS preflight&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;CORS answers; remaining layers do not run&lt;/span&gt;
        &lt;code&gt;204&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;auth&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;2&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;Invalid supplied bearer key&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;Stop authentication; never fall back to cookie&lt;/span&gt;
        &lt;code&gt;401&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;authorization&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;3&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;No authenticated identity&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;No principal is attached to the request&lt;/span&gt;
        &lt;code&gt;401&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;authorization&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;4&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;Missing &lt;code&gt;data:read&lt;/code&gt;&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;Identity exists but lacks permission&lt;/span&gt;
        &lt;code&gt;403&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;handler&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;5&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;Invalid video ID or language&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;Validation fails before credits are reserved&lt;/span&gt;
        &lt;code&gt;400&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;metering&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;6&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;Insufficient credits&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;Reservation fails; cache and YouTube are skipped&lt;/span&gt;
        &lt;code&gt;402 · 0 credits&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;cache&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;7&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;Fresh cache hit&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;Return transcript from KV; skip YouTube&lt;/span&gt;
        &lt;code&gt;200 · 1 credit&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;upstream&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;8&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;Cache miss + YouTube succeeds&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;Fetch transcript, store in KV, return it&lt;/span&gt;
        &lt;code&gt;200 · 3 credits&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;cache&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;9&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;Stale cache + YouTube fails&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;Use retained stale value as fallback&lt;/span&gt;
        &lt;code&gt;200 · 1 credit&lt;/code&gt;
      &lt;/li&gt;
      &lt;li class=&quot;case-row&quot; data-at-layer=&quot;upstream&quot;&gt;
        &lt;span class=&quot;case-step&quot;&gt;10&lt;/span&gt;
        &lt;span class=&quot;case-name&quot;&gt;No cache + YouTube fails&lt;/span&gt;
        &lt;span class=&quot;case-action&quot;&gt;Release reservation; error boundary returns JSON&lt;/span&gt;
        &lt;code&gt;4xx/5xx · 0 credits&lt;/code&gt;
      &lt;/li&gt;
    &lt;/ol&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;style&gt;
  #transcript-path-viz {
    width: 100%;
    color: var(--foreground);
  }
  #transcript-path-viz * {
    box-sizing: border-box;
  }
  #transcript-path-viz .viz-heading {
    margin-bottom: 8px;
  }
  #transcript-path-viz h2,
  #transcript-path-viz h3,
  #transcript-path-viz p {
    margin: 0;
  }
  #transcript-path-viz .viz-heading p {
    margin-top: 4px;
    color: var(--muted-foreground);
  }
  #transcript-path-viz .onion-stage {
    width: min(100%, 700px);
    margin: 0 auto;
  }
  #transcript-path-viz svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }
  #transcript-path-viz .ring {
    fill: none;
    stroke: var(--viz-series-1);
    stroke-width: 23;
    opacity: 0.28;
    cursor: pointer;
    transition: opacity 150ms ease, stroke-width 150ms ease;
    outline: none;
  }
  #transcript-path-viz .ring:nth-child(2) { stroke: var(--viz-series-2); }
  #transcript-path-viz .ring:nth-child(3) { stroke: var(--viz-series-3); }
  #transcript-path-viz .ring:nth-child(4) { stroke: var(--viz-series-4); }
  #transcript-path-viz .ring:nth-child(5) { stroke: var(--viz-series-5); }
  #transcript-path-viz .ring:nth-child(6) { stroke: var(--viz-series-6); }
  #transcript-path-viz .ring:nth-child(7) { stroke: var(--viz-series-1); }
  #transcript-path-viz .ring:nth-child(8) { stroke: var(--viz-series-2); }
  #transcript-path-viz .ring:nth-child(9) { stroke: var(--viz-series-3); }
  #transcript-path-viz .ring:nth-child(10) { stroke: var(--viz-series-4); }
  #transcript-path-viz .ring:hover,
  #transcript-path-viz .ring:focus-visible {
    opacity: 0.72;
  }
  #transcript-path-viz .ring.is-selected {
    opacity: 1;
    stroke-width: 25;
  }
  #transcript-path-viz .flow-arrow {
    pointer-events: none;
  }
  #transcript-path-viz .flow-arrow line {
    stroke: var(--foreground);
    stroke-width: 2;
  }
  #transcript-path-viz .flow-arrow text {
    fill: var(--muted-foreground);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  #transcript-path-viz .step-numbers {
    pointer-events: none;
  }
  #transcript-path-viz .step-numbers text {
    fill: var(--foreground);
    font-size: 10px;
    font-weight: 800;
    text-anchor: middle;
    paint-order: stroke;
    stroke: var(--background);
    stroke-width: 3px;
  }
  #transcript-path-viz .center-label {
    fill: var(--foreground);
    font-size: 12px;
    font-weight: 800;
    pointer-events: none;
  }
  #transcript-path-viz .center-subtitle {
    fill: var(--muted-foreground);
    font-size: 10px;
    pointer-events: none;
  }
  #transcript-path-viz .layer-detail {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) minmax(180px, 0.42fr);
    align-items: center;
    gap: 16px;
    min-height: 104px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
  }
  #transcript-path-viz .layer-count {
    display: grid;
    place-items: center;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 2px solid var(--viz-series-1);
    font-weight: 800;
  }
  #transcript-path-viz .layer-copy h3 {
    margin-bottom: 4px;
  }
  #transcript-path-viz .layer-copy p,
  #transcript-path-viz .service-detail span {
    color: var(--muted-foreground);
  }
  #transcript-path-viz .service-detail {
    display: grid;
    gap: 3px;
    padding-left: 16px;
    border-left: 1px solid var(--border);
  }
  #transcript-path-viz .service-detail strong {
    font-size: 0.92rem;
  }
  #transcript-path-viz .outcomes {
    margin-top: 20px;
  }
  #transcript-path-viz .section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  #transcript-path-viz .section-heading span {
    color: var(--muted-foreground);
    font-size: 0.9rem;
  }
  #transcript-path-viz .outcomes ol {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  #transcript-path-viz .case-row {
    display: grid;
    grid-template-columns: 28px minmax(180px, 0.8fr) minmax(220px, 1.3fr) auto;
    align-items: center;
    gap: 10px;
    min-height: 42px;
    padding: 7px 8px;
    border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    transition: background-color 150ms ease;
  }
  #transcript-path-viz .case-row.is-related {
    background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
  }
  #transcript-path-viz .case-step {
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--muted-foreground);
    font-size: 0.78rem;
    font-weight: 700;
  }
  #transcript-path-viz .case-name {
    font-weight: 650;
  }
  #transcript-path-viz .case-action {
    color: var(--muted-foreground);
  }
  #transcript-path-viz .case-row &gt; code:last-child {
    justify-self: end;
    white-space: nowrap;
  }
  @media (max-width: 620px) {
    #transcript-path-viz .layer-detail {
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px 12px;
    }
    #transcript-path-viz .service-detail {
      grid-column: 1 / -1;
      padding: 10px 0 0;
      border-left: 0;
      border-top: 1px solid var(--border);
    }
    #transcript-path-viz .case-row {
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 5px 8px;
      padding-block: 9px;
    }
    #transcript-path-viz .case-action {
      grid-column: 2 / -1;
      grid-row: 2;
    }
    #transcript-path-viz .case-row &gt; code:last-child {
      grid-column: 3;
      grid-row: 1;
    }
  }
  @media (max-width: 390px) {
    #transcript-path-viz .viz-heading p {
      font-size: 0.9rem;
    }
    #transcript-path-viz .flow-arrow text {
      font-size: 11px;
    }
    #transcript-path-viz .layer-count {
      width: 46px;
      height: 46px;
    }
    #transcript-path-viz .section-heading {
      display: block;
    }
    #transcript-path-viz .section-heading span {
      display: block;
      margin-top: 2px;
    }
    #transcript-path-viz .case-row {
      grid-template-columns: 28px minmax(0, 1fr);
    }

&lt;/style&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;transcript-path-viz&#x27;);
    const layers = {
      entry: {
        number: 1,
        type: &#x27;Worker entry&#x27;,
        name: &#x27;Cloudflare Worker receives the request&#x27;,
        operation: &#x27;The Worker runtime invokes app.fetch(request, env, ctx). This hands the HTTP request to the Hono application.&#x27;,
        service: &#x27;Cloudflare Workers&#x27;
      },
      router: {
        number: 2,
        type: &#x27;Router&#x27;,
        name: &#x27;Hono matches the transcript route&#x27;,
        operation: &#x27;Hono matches the HTTP method and path, then builds the middleware chain registered for that route.&#x27;,
        service: &#x27;Hono running inside Cloudflare Workers&#x27;
      },
      context: {
        number: 3,
        type: &#x27;Middleware&#x27;,
        name: &#x27;requestContext&#x27;,
        operation: &#x27;Creates the request ID, attaches security headers, measures duration, and emits the final structured access log after the response returns.&#x27;,
        service: &#x27;Workers runtime + Workers Logs&#x27;
      },
      cors: {
        number: 4,
        type: &#x27;Middleware&#x27;,
        name: &#x27;applicationCors&#x27;,
        operation: &#x27;Checks the browser origin and requested headers. An OPTIONS preflight returns here; normal transcript requests continue inward.&#x27;,
        service: &#x27;Hono CORS middleware on Workers&#x27;
      },
      auth: {
        number: 5,
        type: &#x27;Middleware&#x27;,
        name: &#x27;establishPrincipal&#x27;,
        operation: &#x27;Tries bearer/API key authentication, then session cookie, then the allowed development demo identity. An invalid supplied key stops with 401 and never falls back to the cookie.&#x27;,
        service: &#x27;Better Auth + API-key plugin + Cloudflare D1&#x27;
      },
      authorization: {
        number: 6,
        type: &#x27;Middleware&#x27;,
        name: &#x27;requireDataPrincipal&#x27;,
        operation: &#x27;Requires an authenticated principal and checks data:read. No identity returns 401; missing permission returns 403.&#x27;,
        service: &#x27;Hono middleware in Worker memory&#x27;
      },
      handler: {
        number: 7,
        type: &#x27;Route handler&#x27;,
        name: &#x27;Transcript endpoint handler&#x27;,
        operation: &#x27;Validates the video ID and optional language, then invokes the metered transcript operation. Invalid input stops before credits are reserved.&#x27;,
        service: &#x27;Cloudflare Workers&#x27;
      },
      metering: {
        number: 8,
        type: &#x27;Application service&#x27;,
        name: &#x27;meterOperation&#x27;,
        operation: &#x27;Reserves 3 credits, runs the transcript work, then settles the cache-dependent cost or releases the reservation when the operation fails.&#x27;,
        service: &#x27;Cloudflare D1 credit ledger&#x27;
      },
      cache: {
        number: 9,
        type: &#x27;Cache service&#x27;,
        name: &#x27;getTranscriptWithCache&#x27;,
        operation: &#x27;Looks up video plus language in KV. A fresh hit returns immediately; a miss continues to YouTube; an expired value may be retained as a stale fallback.&#x27;,
        service: &#x27;Cloudflare Workers KV — YOUTUBE_CACHE&#x27;
      },
      upstream: {
        number: 10,
        type: &#x27;Library + upstream&#x27;,
        name: &#x27;getTranscript&#x27;,
        operation: &#x27;The all-things-youtube library fetches and normalizes the transcript. Success is cached; failure uses stale data when available or propagates an error.&#x27;,
        service: &#x27;Worker outbound HTTPS → YouTube&#x27;
      }
    };

    const ringElements = [...root.querySelectorAll(&#x27;.ring&#x27;)];
    const count = root.querySelector(&#x27;.layer-count&#x27;);
    const title = root.querySelector(&#x27;.layer-copy h3&#x27;);
    const operation = root.querySelector(&#x27;.operation&#x27;);
    const service = root.querySelector(&#x27;.service-detail strong&#x27;);

    const selectLayer = (name) =&gt; {
      const layer = layers[name];
      ringElements.forEach((ring) =&gt; {
        const selected = ring.dataset.layer === name;
        ring.classList.toggle(&#x27;is-selected&#x27;, selected);
        ring.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
      });
      root.querySelectorAll(&#x27;.case-row&#x27;).forEach((row) =&gt; {
        row.classList.toggle(&#x27;is-related&#x27;, row.dataset.atLayer === name);
      });
      count.textContent = `${layer.number} / 10`;
      title.textContent = `${layer.type} · ${layer.name}`;
      operation.textContent = layer.operation;
      service.textContent = layer.service;
    };

    ringElements.forEach((ring) =&gt; {
      ring.addEventListener(&#x27;click&#x27;, () =&gt; selectLayer(ring.dataset.layer));
      ring.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (event.key === &#x27;Enter&#x27; || event.key === &#x27; &#x27;) {
          event.preventDefault();
          selectLayer(ring.dataset.layer);
        }
      });
    });

    selectLayer(&#x27;auth&#x27;);
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
