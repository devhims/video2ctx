<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Agent capability routing</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper:#f7f6f2; --raised:#fff; --wash:#efeee9; --ink:#1d1d1b; --muted:#70716c;
      --soft:#85857f; --rule:#e2e0da; --rule-strong:#9b9992; --accent:#e64b3c;
      --accent-ink:#a83227; --accent-wash:#f8e7e3; --link:#2e5aa8;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
      --serif:Georgia,"Times New Roman",serif; --mono:"SFMono-Regular",Consolas,monospace;
    }
    @media (prefers-color-scheme:dark) {
      :root { --paper:#1d1d1b; --raised:#262624; --wash:#32322f; --ink:#f5f3ec; --muted:#b1b0aa;
        --soft:#92918b; --rule:#44433f; --rule-strong:#77756f; --accent:#ef5b4c;
        --accent-ink:#ff8b7f; --accent-wash:#3d2420; --link:#8eb4ff; }
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); }
    body { display:grid; place-items:center; padding:24px; font-family:var(--sans); }
    main { width:min(100%,1200px); overflow-x:auto; }
    svg { display:block; width:100%; min-width:960px; height:auto; background:var(--paper); }
    text { fill:var(--ink); }
    .title { font:400 32px var(--serif); }
    .subtitle { font-size:12px; fill:var(--muted); }
    .eyebrow,.tag,.tech,.edge,.legend { font-family:var(--mono); }
    .eyebrow,.tag,.legend,.edge { font-size:8px; font-weight:600; letter-spacing:.12em; }
    .eyebrow,.tag,.legend { fill:var(--muted); }
    .node-title { font-size:12px; font-weight:600; text-anchor:middle; }
    .copy { font-size:8px; fill:var(--muted); text-anchor:middle; }
    .tech { font-size:8px; fill:var(--soft); text-anchor:middle; }
    .step { fill:var(--raised); stroke:var(--rule-strong); stroke-width:1; }
    .step-alt { fill:var(--wash); stroke:var(--rule-strong); stroke-width:1; }
    .decision { fill:var(--raised); stroke:var(--rule-strong); stroke-width:1; }
    .decision-focal { fill:var(--accent-wash); stroke:var(--accent); stroke-width:1.2; }
    .terminal { fill:var(--raised); stroke:var(--rule-strong); stroke-width:1.2; }
    .terminal-focal { fill:var(--accent-wash); stroke:var(--accent); stroke-width:1.2; }
    .connector { fill:none; stroke:var(--rule-strong); stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#route-arrow); }
    .connector-link { fill:none; stroke:var(--link); stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#route-arrow-link); }
    .connector-reuse { fill:none; stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#route-arrow); }
    .mask { fill:var(--paper); }
    .edge { fill:var(--soft); text-anchor:middle; }
    .edge-link { fill:var(--link); }
    .edge-accent { fill:var(--accent-ink); }
    .hairline { stroke:var(--rule); stroke-width:1; }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="capability-routing-title capability-routing-desc">
      <title id="capability-routing-title">YouTube Agent capability routing</title>
      <desc id="capability-routing-desc">Flowchart showing admission followed by route reuse or structured classification, persistence of the decision, selection of topic research, video inspection, or clarification, and one shared final result.</desc>
      <defs>
        <marker id="route-arrow" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--rule-strong)"></polygon></marker>
        <marker id="route-arrow-accent" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--accent)"></polygon></marker>
        <marker id="route-arrow-link" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--link)"></polygon></marker>
      </defs>

      <rect width="1200" height="900" fill="var(--paper)"></rect>
      <text class="eyebrow" x="40" y="32">FIRST SEMANTIC STEP</text>
      <text class="title" x="40" y="68">One endpoint, one run, one selected capability</text>
      <text class="subtitle" x="40" y="92">Admission creates the durable run. Classification selects the capability configuration loaded into Agent Core.</text>

      <!-- Connectors render before nodes. -->
      <line class="connector" x1="600" y1="168" x2="600" y2="188"></line>
      <path class="connector" d="M496 240 H340 Q332 240 332 248 V328"></path>
      <line class="connector-link" x1="456" y1="364" x2="480" y2="364"></line>
      <line class="connector" x1="600" y1="400" x2="600" y2="444"></line>
      <path class="connector-reuse" d="M704 240 H1032 Q1040 240 1040 248 V492 Q1040 500 1032 500 H704"></path>
      <path class="connector" d="M496 500 H212 Q204 500 204 508 V604"></path>
      <line class="connector" x1="600" y1="556" x2="600" y2="604"></line>
      <path class="connector" d="M704 500 H988 Q996 500 996 508 V604"></path>
      <path class="connector" d="M204 684 V720 Q204 728 212 728 H532 Q540 728 540 736 V760"></path>
      <line class="connector" x1="600" y1="684" x2="600" y2="760"></line>
      <path class="connector" d="M996 684 V720 Q996 728 988 728 H668 Q660 728 660 736 V760"></path>

      <rect class="mask" x="380" y="220" width="72" height="12" rx="2"></rect>
      <text class="edge" x="416" y="229">NO ROUTE</text>
      <rect class="mask" x="824" y="220" width="96" height="12" rx="2"></rect>
      <text class="edge" x="872" y="229">ROUTE STORED</text>
      <rect class="mask" x="400" y="480" width="48" height="12" rx="2"></rect>
      <text class="edge" x="424" y="489">TOPIC</text>
      <rect class="mask" x="612" y="568" width="48" height="12" rx="2"></rect>
      <text class="edge edge-accent" x="636" y="577">VIDEO</text>
      <rect class="mask" x="752" y="480" width="64" height="12" rx="2"></rect>
      <text class="edge" x="784" y="489">UNCLEAR</text>

      <g aria-label="Admitted durable run">
        <rect class="terminal" x="480" y="112" width="240" height="56" rx="28"></rect>
        <text class="node-title" x="600" y="140">Admitted agent run</text>
        <text class="tech" x="600" y="156">persisted before semantic work</text>
      </g>

      <g aria-label="Decision whether a route was already persisted">
        <polygon class="decision" points="600,188 704,240 600,292 496,240"></polygon>
        <text class="node-title" x="600" y="236">Stored route?</text>
        <text class="tech" x="600" y="252">recovery check</text>
      </g>

      <g aria-label="Structured capability classifier">
        <rect class="step" x="208" y="328" width="248" height="72" rx="8"></rect>
        <text class="tag" x="228" y="348">Bounded model call · 20s</text>
        <text class="node-title" x="332" y="372">Capability classifier</text>
        <text class="copy" x="332" y="388">prompt + extracted video IDs</text>
      </g>

      <g aria-label="Persist validated route">
        <rect class="step-alt" x="480" y="328" width="240" height="72" rx="8"></rect>
        <text class="tag" x="500" y="348">Durable Object SQLite</text>
        <text class="node-title" x="600" y="372">Persist route decision</text>
        <text class="copy" x="600" y="388">recovery will reuse this record</text>
      </g>

      <g aria-label="Validated capability decision">
        <polygon class="decision-focal" points="600,444 704,500 600,556 496,500"></polygon>
        <text class="node-title" x="600" y="496">Selected route</text>
        <text class="tech" x="600" y="512">three validated outcomes</text>
      </g>

      <g aria-label="Topic research capability">
        <rect class="step" x="64" y="604" width="280" height="80" rx="8"></rect>
        <text class="tag" x="84" y="628">topic_research</text>
        <text class="node-title" x="204" y="652">Load research configuration</text>
        <text class="copy" x="204" y="668">10 provider tools + analyst policy + finalizer</text>
      </g>

      <g aria-label="Inspect video capability">
        <rect class="step" x="460" y="604" width="280" height="80" rx="8"></rect>
        <text class="tag" x="480" y="628">inspect_video</text>
        <text class="node-title" x="600" y="652">Load inspection configuration</text>
        <text class="copy" x="600" y="668">5 provider tools + finalizer</text>
      </g>

      <g aria-label="Clarification result without Agent Core">
        <rect class="step-alt" x="856" y="604" width="280" height="80" rx="8"></rect>
        <text class="tag" x="876" y="628">clarification</text>
        <text class="node-title" x="996" y="652">Direct finalization</text>
        <text class="copy" x="996" y="668">no provider call or Agent Core</text>
      </g>

      <g aria-label="Persisted agent result">
        <rect class="terminal-focal" x="480" y="760" width="240" height="56" rx="28"></rect>
        <text class="node-title" x="600" y="788">Persisted agent result</text>
        <text class="tech" x="600" y="804">intent must match stored route</text>
      </g>

      <line class="hairline" x1="40" y1="848" x2="1160" y2="848"></line>
      <line x1="56" y1="872" x2="88" y2="872" stroke="var(--rule-strong)" stroke-width="1.2" marker-end="url(#route-arrow)"></line>
      <text class="legend" x="100" y="876">CURRENT RUN PATH</text>
      <line x1="300" y1="872" x2="332" y2="872" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#route-arrow)"></line>
      <text class="legend" x="344" y="876">RECOVERY REUSE</text>
      <text class="legend" x="1160" y="876" text-anchor="end">NO PROVIDER CALL BEFORE ROUTING</text>
    </svg>
  </main>
</body>
</html>
