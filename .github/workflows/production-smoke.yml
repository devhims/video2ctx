name: Production smoke Worker checks
on:
  pull_request:
    paths:
      - 'workers/production-smoke/**'
      - '.github/workflows/production-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'workers/production-smoke/**'
      - '.github/workflows/production-smoke.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/production-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/production-smoke/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
