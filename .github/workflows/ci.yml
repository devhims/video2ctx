name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-and-skill:
    name: Library and skill bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/all-things-youtube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/all-things-youtube/package-lock.json
            packages/youtube-skills/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix ../youtube-skills
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm test
      - run: npm test --prefix ../youtube-skills
        env:
          WATCH_FFMPEG_TEST: '1'
      - run: npm run typecheck --prefix ../youtube-skills
      - run: npm run bundle:check --prefix ../youtube-skills
      - run: test -x ../../.agents/skills/youtube-ctx/scripts/youtube.mjs
      - run: node ../../.agents/skills/youtube-ctx/scripts/youtube.mjs --help
      - run: test -x ../../.agents/skills/youtube-ctx/scripts/watch.mjs
      - run: node ../../.agents/skills/youtube-ctx/scripts/watch.mjs --help
      - run: npm pack --dry-run

  platform:
    name: Platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            platform/youtube-processor/package-lock.json
            packages/video2ctx-cli/package-lock.json
            web/package-lock.json
      - name: Install platform dependencies
        run: npm ci
      - name: Install hosted CLI dependencies
        run: npm ci
        working-directory: packages/video2ctx-cli
      - name: Verify hosted CLI
        run: npm run verify
        working-directory: packages/video2ctx-cli
      - name: Verify published CLI package contents
        run: npm pack --dry-run
        working-directory: packages/video2ctx-cli
      - name: Verify platform
        run: npm run verify
      - name: Install web dependencies for auth E2E
        run: npm ci --prefix ../web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run CLI and browser auth E2E
        run: npm --prefix .. run test:auth:e2e

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            platform/package-lock.json
      - run: npm ci --prefix platform
      - run: npm ci --prefix docs
      - run: npm run docs:check
      - run: npm run docs:verify
