name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-changes:
    name: Detect dashboard changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/github-script@v7
        id: filter
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const isDashboardPath = filename =>
              filename.startsWith('web/') ||
              filename.startsWith('platform/') ||
              filename.startsWith('.github/workflows/') ||
              filename === 'package.json' ||
              filename === 'package-lock.json';
            const changed = files.some(({ filename, previous_filename }) =>
              isDashboardPath(filename) ||
              (previous_filename && isDashboardPath(previous_filename))
            );
            core.setOutput('changed', String(changed));

  library-and-skill:
    name: Library and skill bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/all-things-youtube
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/all-things-youtube/package-lock.json
            packages/youtube-skills/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix ../youtube-skills
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: npm test
      - run: npm test --prefix ../youtube-skills
        env:
          WATCH_FFMPEG_TEST: '1'
      - run: npm run typecheck --prefix ../youtube-skills
      - run: npm run bundle:check --prefix ../youtube-skills
      - run: test -x ../../.agents/skills/youtube-ctx/scripts/youtube.mjs
      - run: node ../../.agents/skills/youtube-ctx/scripts/youtube.mjs --help
      - run: test -x ../../.agents/skills/youtube-ctx/scripts/watch.mjs
      - run: node ../../.agents/skills/youtube-ctx/scripts/watch.mjs --help
      - run: npm pack --dry-run
      - run: npm run test:packed

  platform-checks:
    name: Platform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            packages/all-things-youtube/package-lock.json
            platform/youtube-processor/package-lock.json
            platform/youtube-frames/package-lock.json
            packages/video2ctx-cli/package-lock.json
      - name: Install platform dependencies
        run: npm ci
      - name: Install hosted CLI dependencies
        run: npm ci
        working-directory: packages/video2ctx-cli
      - name: Verify hosted CLI
        run: npm run verify
        working-directory: packages/video2ctx-cli
      - name: Verify published CLI package contents
        run: npm pack --dry-run
        working-directory: packages/video2ctx-cli
      - name: Install container dependencies
        run: npm ci --prefix youtube-processor && npm ci --prefix youtube-frames
      - name: Verify storyboard bundle
        run: npm --prefix youtube-processor run bundle:check
      - name: Type check platform
        run: npm run build
      - name: Run platform unit tests
        run: npm test
      - name: Profile Worker startup (local CPU, no deployment)
        run: npm run check:startup
      - uses: actions/upload-artifact@v4
        with:
          name: worker-startup-profile
          path: platform/.wrangler/startup.cpuprofile
          include-hidden-files: true

  platform-integration:
    name: Platform integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            platform/youtube-processor/package-lock.json
            platform/youtube-frames/package-lock.json
      - name: Install platform dependencies
        run: npm ci
      - name: Install container dependencies
        run: npm ci --prefix youtube-processor && npm ci --prefix youtube-frames
      - name: Run auth integration tests
        run: npm run test:auth:integration
      - name: Verify processor Linux image
        run: |
          docker build --platform linux/amd64 -t youtube-processor:test -f youtube-processor/Dockerfile youtube-processor
          docker run --rm --platform linux/amd64 --network none --mount type=bind,src="$PWD/youtube-processor/test",dst=/app/test,readonly youtube-processor:test sh -c 'node --test test/*.test.mjs'

  auth-e2e:
    name: Auth E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            packages/video2ctx-cli/package-lock.json
            web/package-lock.json
      - name: Install platform dependencies
        run: npm ci
      - name: Install hosted CLI dependencies
        run: npm ci
        working-directory: packages/video2ctx-cli
      - name: Install web dependencies
        run: npm ci --prefix ../web
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run CLI and browser auth E2E
        run: npm --prefix .. run test:auth:e2e

  # Keeps the required "Platform + Auth E2E" check while the work runs in parallel jobs.
  platform-gate:
    name: Platform + Auth E2E
    if: always()
    needs: [platform-checks, platform-integration, auth-e2e, dashboard-changes, dashboard-e2e]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  dashboard-e2e:
    name: Dashboard E2E (${{ matrix.shard }}/4)
    needs: dashboard-changes
    if: needs.dashboard-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            web/package-lock.json
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: next-webpack-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.[jt]s', 'web/**/*.[jt]sx', 'web/**/*.css', '!web/node_modules/**', '!web/.next/**') }}
          restore-keys: |
            next-webpack-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
      - name: Restore installed dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: |
            platform/node_modules
            web/node_modules
          key: dashboard-modules-${{ runner.os }}-node22-${{ hashFiles('platform/package-lock.json', 'web/package-lock.json') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci && npm ci --prefix ../web
      # The runner image already has Chromium's system libraries; --with-deps only adds extra fonts.
      - run: npx playwright install --only-shell chromium
      - run: npm run test:agent:dashboard -- --shard=${{ matrix.shard }}/4 --fully-parallel
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-e2e-results-${{ matrix.shard }}
          path: .scratch/agent-sessions-dashboard/playwright-results
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            platform/package-lock.json
      - run: npm ci --prefix platform
      - run: npm ci --prefix docs
      - run: npm run docs:check
      - run: npm run docs:verify
